{% extends "base.html" %}
{% load static %}

{% block title %}Exames{% endblock %}

{% block content %}
    <section>
        <div class="title">
            <h1>Exames</h1>
            <a class="btn-solid theme-primary" href="{% url 'hospital:exame_create' %}">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-circle-fill" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3z"/>
                </svg>
                Adicionar
            </a>
        </div>

        <div class="cards">
            {% for exame in exames %}
            <article class="card">
                <p><strong>Paciente: </strong>{{ exame.paciente.nome }}</p>
                <p><strong>Medico: </strong>{{ exame.medico.nome }}</p>
                <p><strong>Peridodo: </strong>{{ exame.peridodo }}</p>
            </article>
            {% endfor %}
        </div>
    </section>
{% endblock %}
