{% extends "base.html" %}

{% block title %}Nova pessoa{% endblock %}

{% block content %}
    <section>
        <div class="title">
            <h1>Novo Paciente</h1>
            <a class="btn-outline" href="{% url 'hospital:pacientes_list' %}">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="25" fill="currentColor" class="bi bi-x-circle-fill" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293z"/>
                </svg>
            </a>
        </div>

        <form method="post" class="d-flex flex-column gap-4">
            {% csrf_token %}

            <div class="form-field">
                <label class="form-label fw-semibold">Nome</label>
                <input type="text" name="nome" class="form-control" placeholder="Digite o nome do paciente" required>
            </div>
            
            <div class="form-field">
                <label class="form-label fw-semibold">Idade</label>
                <input type="number" name="idade" class="form-control" placeholder="Digite a idade do paciente" required>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'hospital:medicos_list' %}" class="btn">Cancelar</a>
                <button type="submit" class="btn-solid theme-success">Salvar</button>
            </div>
        </form>
    </section>    
{% endblock %}
